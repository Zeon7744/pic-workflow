# ComfyUI T3 档启动配置（14-16GB，如 RTX 3080 Ti / 4070 Ti，Ampere）
# 特点：FP16/BF16 + SageAttention + 720P 视频 + SDXL-Turbo 768
name: "comfyui_T3"
tier: T3
launch:
  entrypoint: "python main.py"
  args:
    - "--fp16-vae"
    - "--bf16-unet"              # Ampere/Ada 支持 BF16，出图更快
    - "--use-sage-attention"      # Ampere 完全支持 SageAttention
    - "--high-ram"                # 16GB+ 内存时启用，省显存
    - "--cuda"
attention:
  type: "sage_attention"
  sage: true
quantization:
  dtype: "fp16"
  precision: "fp16/bf16"        # 不用量化，FP16 已够用
  offload: false
  vram_budget_gb: 12.5          # 留 3.5GB 余量
resolution:
  image: 768                     # SDXL-Turbo 768，或 FLUX Q4 1024
  video: 720                     # LTX2.3 720P
vae:
  tiling: false                  # 显存够，关 tiling 提速
models:
  text_to_image: {path: "models/checkpoints/sdxl_turbo.safetensors", quant: "fp16"}
  text_to_video: {path: "models/ltx/LTX-Video-2.3.safetensors", quant: "bf16"}
  tts: {path: "models/gpt_sovits_full.bin"}
fallback:
  - "OOM -> 切 T2 配置（SDXL-Turbo 768 + LTX0.95 720P）"
  - "仍 OOM -> 切 T1 配置（GGUF Q4 + offload）"

# Agnes Image 2.5 Flash 云端参数（T3 推荐：2K + 16:9 短剧横屏）
# API: POST https://api.agnes-ai.cn/v1/images/generations
# 环境变量: AGNES_IMAGE_API_KEY
agnes_image:
  model: "agnes-image-2.5-flash"
  size: "2K"              # 1K(1024) / 2K(2048) / 3K(3072) / 4K(4096)
  ratio: "16:9"           # 1:1/3:4/4:3/16:9/9:16/2:3/3:2/21:9
  prompt_style: |
    [主体] + [场景/环境] + [风格] + [光照] + [构图] + [质量要求]
    例：电影级写实镜头，薄雾峡谷发光浮空城市，广角构图，丰富建筑细节，金色光线，高视觉密度

# Agnes Video 2.5 Flash 云端参数（视频镜头兜底）
# API: POST https://api.agnes-ai.cn/v1/videos
# 环境变量: AGNES_VIDEO_API_KEY
# 限制：size 固定 720P（1280x704@16:9），最多 5 张参考图，最多 3 段音频
agnes_video:
  model: "agnes-video-2.5-flash"
  size: "720P"
  ratio: "16:9"
  seconds: "5"
  modes:
    text: "纯文本生成"
    keyframe: "首尾帧控制（T3+ 推荐，配合角色图）"
    reference: "图片/音频参考（T4+ 推荐）"
