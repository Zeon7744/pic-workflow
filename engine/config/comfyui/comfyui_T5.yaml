# ComfyUI T5 档启动配置（32GB+，如 RTX 4090 / 5090 / H100，Ada/FP8）
# 特点：FLUX LoRA 训练 + Wan2.2 14B 1080P + FP8/BF16
name: "comfyui_T5"
tier: T5
launch:
  entrypoint: "python main.py"
  args:
    - "--fp16-vae"
    - "--bf16-unet"
    - "--use-sage-attention"
    - "--cuda"
    - "--directml"                 # 可选：CPU/GPU 混合（无 CUDA 兜底用）
attention:
  type: "sage_attention"
  sage: true
quantization:
  dtype: "fp16"
  precision: "fp16"              # 主路径不量化；如需更大模型可切 bf16/FP8
  offload: false
  vram_budget_gb: 28.0          # 留 4GB 余量给 LoRA 训练
resolution:
  image: 1024                    # FLUX fp16 1024 + LoRA 微调
  video: 1080                    # Wan2.2 14B 1080P
vae:
  tiling: false
models:
  text_to_image:
    - {path: "models/checkpoints/FLUX.1-fp16.safetensors", quant: "fp16"}       # 主模型
    - {path: "models/checkpoints/flux_lora.safetensors", quant: "fp16", note: "LoRA 权重"}
  text_to_video: {path: "models/wan/Wan2.2-14B-1080p.safetensors", quant: "bf16"}
  tts: {path: "models/gpt_sovits_full.bin"}
training:
  enabled: true
  lora_rank: 64
  lora_alpha: 32
  target_modules: ["attn1", "attn2"]
fallback:
  - "OOM -> 切 T4 配置（FLUX fp16 1024 + Wan2.2 14B 720P）"
  - "仍 OOM -> 切 T3 配置（LTX2.3 720P）"
  - "训练 OOM -> 切 LoRA rank 32 或加 --gradient-checkpointing"

# Agnes Image 2.5 Flash 云端参数（T5 推荐：4K + 21:9 cinematic）
agnes_image:
  model: "agnes-image-2.5-flash"
  size: "4K"
  ratio: "21:9"           #  cinematic 超宽屏
  prompt_style: |
    [主体] + [场景/环境] + [风格] + [光照] + [构图] + [质量要求]
    例：电影级写实镜头，薄雾峡谷发光浮空城市，广角构图，丰富建筑细节，金色光线，高视觉密度

# Agnes Video 2.5 Flash 云端参数（视频镜头兜底）
# API: POST https://api.agnes-ai.cn/v1/videos
# 环境变量: AGNES_VIDEO_API_KEY
# 限制：size 固定 720P（1280x704@16:9），最多 5 张参考图，最多 3 段音频
agnes_video:
  model: "agnes-video-2.5-flash"
  size: "720P"
  ratio: "16:9"
  seconds: "5"
  modes:
    text: "纯文本生成"
    keyframe: "首尾帧控制（T3+ 推荐，配合角色图）"
    reference: "图片/音频参考（T4+ 推荐）"
