    beats:
    - hook
    - payoff
    intensity: 5
    note: 只给一个关键细节：眼神、手、物件，直接制造疑问
  SP2_closeup:
    label: 特写
    shot_size: 特写
    camera_move: 固定
    est_s: 3.0
    beats:
    - payoff
    - sweet
    intensity: 4
    note: 情绪落点特写，爽点兑现后给脸部反应
