version: 0.3.0
default_policy:
  philosophy: 低配优先跑通率，不追峰值画质
  low_tiers_prefer:
  - gguf_q4_offload
  - cloud_fallback
  high_tiers_unlock:
  - 720p_video
  - fp16_sdxl
  - sage_attention
  - lora_trained
  unlock_at_tier: T2
  t0_t1_runrate_goal: 0.95
  low_res_default:
    T0:
      image: 512
      video: 480
    T1:
      image: 512
      video: 480
style_tracks:
  S1_anime_jp:
    label: 日系2D动漫
    image_model:
    - sdxl_anime_lora
    - sd15_gguf_q4_512_offload
    - cloud_api_seedream
    video_model:
    - wan13b_gguf_q4_offload_480
    - cloud_kling
    prompt_prefix: 日本2D手绘动漫风, 新海诚式体积光, 青蓝主色+暖橙霓虹点缀, 动漫线稿清晰, 高细节
    lora: anime_style_animerus
    tts_voice: vivi
    bgm_style: cinematic_pianissimo
    sfx: light
    params:
      image_res: '768'
      video_res: '480'
      neg_prompt_strength: 0.7
      seed_range:
      - 0
      - 9999
      aspect_ratio: '16:9'
      fps: 24
    agnes_image:
      model: agnes-image-2.5-flash
      size_by_tier:
        T0: 1K
        T1: 1K
        T2: 2K
        T3: 2K
        T4: 4K
        T5: 4K
