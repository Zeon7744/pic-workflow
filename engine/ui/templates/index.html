<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爽点厂 HookForge · 一键出片</title>
<style>
:root{--bg:#0f1220;--card:#1a1f35;--accent:#ff4d6d;--accent2:#4d7cfe;
--text:#e8eaf2;--muted:#9aa0b5;--ok:#3ddc84;--err:#ff6b6b;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
background:linear-gradient(160deg,#0f1220 0%,#1a1030 100%);color:var(--text);
min-height:100vh;padding:24px}
.wrap{max-width:860px;margin:0 auto}
.hero{text-align:center;margin-bottom:28px}
.hero h1{font-size:30px;font-weight:800;letter-spacing:1px}
.hero h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));
-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin-top:8px;font-size:15px}
.card{background:var(--card);border-radius:var(--r);padding:22px;
box-shadow:0 8px 30px rgba(0,0,0,.35);margin-bottom:18px}
.card h2{font-size:16px;margin-bottom:14px;color:var(--accent);font-weight:600}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
textarea{width:100%;min-height:140px;background:#101427;border:1px solid #2a3050;
border-radius:10px;color:var(--text);padding:12px;font-size:14px;resize:vertical;
font-family:inherit}
textarea:focus{outline:none;border-color:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.grid label{margin-top:4px}
select,input[type=number]{width:100%;background:#101427;border:1px solid #2a3050;
border-radius:10px;color:var(--text);padding:10px;font-size:14px}
select:focus,input:focus{outline:none;border-color:var(--accent2)}
.btn{width:100%;margin-top:20px;background:linear-gradient(90deg,var(--accent),var(--accent2));
border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;padding:14px;
cursor:pointer;transition:.2s}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tip{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.status{margin-top:16px;font-size:14px;line-height:1.7}
.st-ok{color:var(--ok)}.st-err{color:var(--err)}.st-run{color:var(--accent2)}
.progress{margin-top:12px}
.bar{height:8px;background:#101427;border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
width:0;transition:width .4s}
.dl{display:inline-block;margin-top:14px;padding:10px 20px;border-radius:10px;
background:var(--ok);color:#08301a;font-size:14px;font-weight:600;text-decoration:none}
.steps{list-style:none;margin-top:10px}
.steps li{padding:5px 0;font-size:13px;color:var(--muted);opacity:.6}
.steps li.done{color:var(--text);opacity:1}
.steps li.done::before{content:"✓ ";color:var(--ok)}
.steps li.fail{color:var(--err)}
.steps li.fail::before{content:"✗ "}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>爽点厂 <span>HookForge</span></h1>
    <p>粘贴剧本 → 选档位/画风/剧种 → 一键出片 · 给创作者的短剧视频工作流引擎</p>
  </div>

  <div class="card">
    <h2>① 粘贴你的剧本</h2>
    <textarea id="script" placeholder="第1场：男主进屋看到刀，神色凝重
第2场：男主拿起刀冲向门口
第3场：男主和反派在门口对峙
第4场：反转——刀上刻着男主的名字，真相揭晓…
（支持 markdown 标题，会自动跳过；建议 3-10 场/集）"></textarea>
    <p class="tip">💡 写清每场动作+情绪，效果最好。剧种决定 BGM/配音风格，画风决定画面质感。</p>
  </div>

  <div class="card">
    <h2>② 选择出片配置</h2>
    <div class="grid">
      <div>
        <label>档位（你的电脑配置）</label>
        <select id="tier">{% for v,l in tiers %}<option value="{{v}}">{{l}}</option>{% endfor %}</select>
      </div>
      <div>
        <label>画风</label>
        <select id="style">{% for v,l in styles %}<option value="{{v}}">{{l}}</option>{% endfor %}</select>
      </div>
      <div>
        <label>剧种（决定 BGM/配音）</label>
        <select id="scenario">{% for v,l in scenarios %}<option value="{{v}}">{{l}}</option>{% endfor %}</select>
      </div>
      <div>
        <label>本集分镜数</label>
        <input type="number" id="ep" value="10" min="1" max="20">
      </div>
    </div>
    <p class="tip">🖥 不确定选哪档？1060/1650 这类入门卡选 <b>T1</b>；轻薄本无独显选 <b>T0</b>（纯云端出片）；3060/4060 选 <b>T2</b>。</p>
  </div>

  <button class="btn" id="go">🎬 一键出片</button>

  <div class="card" id="resultCard" style="display:none">
    <h2>③ 出片结果</h2>
    <div class="status" id="status"></div>
    <div class="progress" id="progressWrap" style="display:none">
      <div class="bar"><div id="bar"></div></div>
      <ul class="steps" id="steps"></ul>
    </div>
    <a class="dl" id="dl" style="display:none">⬇ 下载成片</a>
    <p class="tip" id="meta"></p>
  </div>
</div>

<script>
const stages = ['script_struct','bgm','character_image','storyboard_prompt',
'video_shot','fx_enhance','post_assemble','bgm_audio','package_publish'];
const stageZh = {script_struct:'拆解剧本',bgm:'选BGM',character_image:'画角色',
storyboard_prompt:'生成分镜',video_shot:'渲染视频',fx_enhance:'加特效',
post_assemble:'合成成片',bgm_audio:'配BGM',package_publish:'打包发布'};
document.getElementById('go').onclick = async function(){
  const btn=this; const script=document.getElementById('script').value.trim();
  if(!script){alert('请先粘贴剧本内容');return}
  btn.disabled=true; btn.textContent='出片中…';
  document.getElementById('resultCard').style.display='block';
  document.getElementById('status').className='status st-run';
  document.getElementById('status').textContent='⏳ 正在出片，请稍候（30秒~2分钟）…';
  document.getElementById('progressWrap').style.display='block';
  document.getElementById('steps').innerHTML='';
  document.getElementById('dl').style.display='none';
  document.getElementById('bar').style.width='10%';
  try{
    const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({script,tier:tier.value,style:style.value,scenario:scenario.value,
        ep:+ep.value,free_vram_gb: tier.value==='T0'?0: tier.value==='T2'?8:6})});
    const d=await r.json();
    if(d.ok){
      document.getElementById('status').className='status st-ok';
      document.getElementById('status').textContent='✓ 出片成功！';
      const ul=document.getElementById('steps');
      (d.order||[]).forEach(s=>{
        const li=document.createElement('li');
        li.textContent=stageZh[s]||s;
        li.className = (d.completed||[]).includes(s)?'done':'fail';
        if((d.failed||{})[s]) li.textContent+='（'+d.failed[s]+'）';
        ul.appendChild(li);
      });
      document.getElementById('bar').style.width='100%';
      document.getElementById('meta').textContent=
        `时长 ${d.duration_s}s · ${d.clip_count} 个镜头 · ${stageZh[d.order[d.order.length-1]]||''} 完成`;
      const dl=document.getElementById('dl');
      if(d.video_download && d.final_video){
        dl.style.display='inline-block';
        dl.href='/download/'+encodeURIComponent(d.final_video).replace(/%2F/g,'/');
        dl.textContent='⬇ 下载成片（'+d.duration_s+'s）';
      }
    }else{
      document.getElementById('status').className='status st-err';
      document.getElementById('status').textContent='✗ '+(d.error||'出片失败');
      if(d.failed){for(const k in d.failed){
        const p=document.createElement('p');p.className='tip';
        p.textContent='环节「'+stageZh[k]+'」：'+d.failed[k];
        document.getElementById('status').appendChild(p);}}
    }
  }catch(e){
    document.getElementById('status').className='status st-err';
    document.getElementById('status').textContent='✗ 请求失败：'+e;
  }
  btn.disabled=false; btn.textContent='🎬 一键出片';
};
</script>
</body>
</html>
