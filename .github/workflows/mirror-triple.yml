# 三端自动镜像：GitHub push → GitCode 自动同步（Gitee 手动，跨平台 IP 策略限制）
# 凭据走 GitHub Secrets：GITCODE_TOKEN（GITEE_TOKEN 可选，配了才自动推 Gitee）
name: mirror-triple

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -e
          REPO_NAME="pic-workflow"
          GITCODE_TOKEN_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$GITCODE_TOKEN")
          git remote add gitcode "https://Zeon7744:${GITCODE_TOKEN_ENC}@gitcode.com/Zeon7744/${REPO_NAME}.git" 2>/dev/null || \
            git remote set-url gitcode "https://Zeon7744:${GITCODE_TOKEN_ENC}@gitcode.com/Zeon7744/${REPO_NAME}.git"
          git fetch gitcode main 2>/dev/null || true
          git push gitcode main --force
          echo "✅ GitCode synced: $(git rev-parse main)"

      - name: Mirror to Gitee (optional, may 403 due to Gitee IP policy)
        if: github.event_name != 'schedule'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        continue-on-error: true
        run: |
          REPO_NAME="pic-workflow"
          GITEE_TOKEN_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$GITEE_TOKEN")
          git remote add gitee "https://oauth2:${GITEE_TOKEN_ENC}@gitee.com/Zeon7744/${REPO_NAME}.git" 2>/dev/null || \
            git remote set-url gitee "https://oauth2:${GITEE_TOKEN_ENC}@gitee.com/Zeon7744/${REPO_NAME}.git"
          git push gitee main --force-with-lease 2>&1 || \
            echo "⚠️ Gitee 推码失败（Gitee 对 Actions 出口 IP 的 oauth2 认证策略），已降级为手动同步；不影响 GitCode 镜像"

      - name: Summary
        run: |
          echo "## Mirror-triple 完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- 仓: Zeon7744/pic-workflow" >> "$GITHUB_STEP_SUMMARY"
          echo "- 触发: ${{ github.event_name }} @ ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitCode: 自动镜像 ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gitee: 手动同步（跨平台 IP 策略限制）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 时间: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
